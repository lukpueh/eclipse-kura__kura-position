name: Kura SBOM upload

on:
  schedule:
    # At 00:00 on Sunday
    - cron: "0 0 * * 0"
  workflow_dispatch:
    inputs:
      target_branch:
        type: string
        default: 'develop'
        required: true
  workflow_run:
    workflows: ["Release Notes automation"]
    types:
      - completed

permissions:
  contents: read
  packages: read
  # The shared workflow authenticates the SBOM upload with OIDC; a
  # called workflow cannot request more permission than its caller.
  id-token: write

jobs:
  call-workflow-in-public-repo:
    # STAGING: the fork carries the migration and `staging: true`.
    uses: lukpueh/eclipse-kura__.github/.github/workflows/_shared-sbom-cyclonedx.yml@sbom-staging-test
    with:
      # The parent project UUID the uploaded SBOM should be associated with.
      # Refer to https://sbom.eclipse.org/ to retrieve the UUID.
      dependency-track-id: 'e464c184-5859-497e-8e2f-937f0dd451f6'
